services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - "./config:/app/config"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web_proxy
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=$ALLOWED_HOSTS
      - TZ=Europe/Madrid
      - PUID=$PUID
networks:
  web_proxy:
    external: true
