services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${ADMIN_PORT:-81}:81'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - web_proxy

networks:
  web_proxy:
    external: true
